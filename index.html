<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seminar Viktorinasi — Yangi O‘zbekiston Islohotlari</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --accent: #ef4444;
      --accent-2: #38bdf8;
      --ok: #22c55e;
      --bad: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 70%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    p.desc {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .rules {
      background: var(--card-2);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 22px;
      display: grid;
      gap: 10px;
      font-size: 14px;
    }

    .rules div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-2);
    }

    button.btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button.btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .q-counter {
      font-weight: 700;
      color: var(--accent-2);
      font-size: 15px;
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .timer-box.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.6);
      animation: pulse 0.9s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .progress-wrap {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      transition: width 1s linear;
    }

    .question-text {
      font-size: 19px;
      line-height: 1.45;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: var(--card-2);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-2);
      background: #304159;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.9;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--ok);
      color: #bbf7d0;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--bad);
      color: #fecaca;
    }

    .status-note {
      margin-top: 16px;
      min-height: 22px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .score-card {
      text-align: center;
      padding: 10px 0;
    }

    .score-big {
      font-size: 46px;
      font-weight: 800;
      color: var(--accent-2);
      margin: 12px 0;
    }

    .locked-box {
      text-align: center;
      padding: 12px 0;
    }

    .meta-info {
      margin-top: 14px;
      background: var(--card-2);
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
    // Bir marta qatnashishni tekshirish kaliti
    const STORAGE_KEY = "seminar_yangi_ozbekiston_quiz_attempt_v1";
    const QUESTION_TIME = 30;

    const QUESTIONS = [
      {
        q: "O‘zbekiston Respublikasida Prezidentlik lavozimi qachon joriy etilgan?",
        options: [
          "1990-yil 24-mart",
          "1991-yil 29-dekabr",
          "1991-yil 31-avgust",
          "1992-yil 8-dekabr"
        ],
        answer: 0
      },
      {
        q: "O‘zbekistonda ilk bor Prezidentlik saylovi qachon bo‘lib o‘tgan?",
        options: [
          "1990-yil 24-mart",
          "1991-yil 29-dekabr",
          "2016-yil 4-dekabr",
          "2021-yil 24-oktabr"
        ],
        answer: 1
      },
      {
        q: "Yangi tahrirdagi O‘zbekiston Respublikasi Konstitutsiyasining qaysi bobida Prezidentning huquqiy maqomi, vazifalari va vakolatlari belgilangan?",
        options: [
          "I bobda",
          "VII bobda",
          "XIX bobda",
          "XXIII bobda"
        ],
        answer: 2
      },
      {
        q: "Konstitutsiyaning 109-moddasiga ko‘ra Prezidentning maqomi necha band qilib berilgan?",
        options: [
          "15 ta band",
          "20 ta band",
          "25 ta band",
          "30 ta band"
        ],
        answer: 2
      },
      {
        q: "Shavkat Mirziyoyev 2016-yil 4-dekabrda bo‘lib o‘tgan Prezident saylovida saylovchilarning necha foiz ovozi bilan saylangan?",
        options: [
          "80,1 foiz",
          "88,61 foiz",
          "90,21 foiz",
          "92,4 foiz"
        ],
        answer: 1
      },
      {
        q: "Muddatidan oldin Prezident saylovi o‘tkazilishi qachon belgilandi?",
        options: [
          "2021-yil 24-oktabr",
          "2023-yil 30-aprel",
          "2023-yil 9-iyul",
          "2024-yil 1-yanvar"
        ],
        answer: 2
      },
      {
        q: "2017–2021 yillarda amalga oshirilgan “Harakatlar strategiyasi” nechta ustuvor yo‘nalishni o‘z ichiga oladi?",
        options: [
          "3 ta",
          "5 ta",
          "7 ta",
          "8 ta"
        ],
        answer: 1
      },
      {
        q: "Yangi tahrirdagi Konstitutsiya bo‘yicha referendum qachon o‘tkazildi va necha foiz ijobiy ovoz oldi?",
        options: [
          "2023-yil 1-may — 88,61%",
          "2023-yil 30-aprel — 90,21%",
          "2023-yil 9-iyul — 80,1%",
          "2022-yil 20-dekabr — 91,5%"
        ],
        answer: 1
      },
      {
        q: "Yangi tahrirdagi O‘zbekiston Respublikasi Konstitutsiyasi qachondan kuchga kirdi?",
        options: [
          "30.04.2023",
          "01.05.2023",
          "09.07.2023",
          "08.12.2023"
        ],
        answer: 1
      },
      {
        q: "Yangi tahrirdagi Konstitutsiya tarkibida nechta bo‘lim, bob va modda mavjud?",
        options: [
          "5 bo‘lim, 26 bob, 128 modda",
          "6 bo‘lim, 27 bob, 155 modda",
          "7 bo‘lim, 25 bob, 150 modda",
          "6 bo‘lim, 28 bob, 160 modda"
        ],
        answer: 1
      },
      {
        q: "Konstitutsiyaning 25-moddasiga muvofiq O‘zbekiston Respublikasida qanday jazo taqiqlanadi?",
        options: [
          "Jarima jazosi",
          "O‘lim jazosi",
          "Axloq tuzatish ishlari",
          "Jamoat ishlari"
        ],
        answer: 1
      },
      {
        q: "Konstitutsiyaning 27-moddasiga ko‘ra shaxs sudning qarorisiz necha soatdan ortiq ushlab turilishi mumkin emas?",
        options: [
          "24 soat",
          "36 soat",
          "48 soat",
          "72 soat"
        ],
        answer: 2
      },
      {
        q: "2022–2026 yillarga mo‘ljallangan Yangi O‘zbekistonning taraqqiyot strategiyasi nechta maqsaddan iborat?",
        options: [
          "75 ta maqsad",
          "88 ta maqsad",
          "100 ta maqsad",
          "120 ta maqsad"
        ],
        answer: 2
      },
      {
        q: "Taraqqiyot strategiyasining I yo‘nalishi (“Inson qadrini yuksaltirish...”) 1-maqsadida qaysi institut faoliyati samaradorligini oshirish belgilangan?",
        options: [
          "Ombudsman instituti",
          "Mahalla instituti",
          "Advokatura instituti",
          "Notariat instituti"
        ],
        answer: 1
      },
      {
        q: "Oliy Majlisning Inson huquqlari bo‘yicha vakili (Ombudsman) instituti O‘zbekistonda qachon tashkil etilgan?",
        options: [
          "1991-yilda",
          "1995-yilda",
          "2003-yilda",
          "2017-yilda"
        ],
        answer: 1
      }
    ];

    const app = document.getElementById("app");
    let studentName = "";
    let currentIdx = 0;
    let score = 0;
    let timeLeft = QUESTION_TIME;
    let timerInterval = null;
    let lockedOption = false;

    function getAttempt() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch {
        return null;
      }
    }

    function saveAttempt(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function renderLockedView(attempt) {
      app.innerHTML = `
        <div class="locked-box">
          <div class="badge">QATNASHISH CHEKLANGAN</div>
          <h1>Siz bu viktorinada allaqachon ishtirok etgansiz</h1>
          <p class="desc">Qoidaga ko‘ra, har bir foydalanuvchi ushbu seminardan faqat <strong>1 marta</strong> qatnashishi mumkin.</p>
          <div class="meta-info">
            <strong>Ishtirokchi:</strong> ${escapeHtml(attempt.name || "Noma’lum")}<br/>
            <strong>Natija:</strong> ${attempt.score} / ${QUESTIONS.length} ball<br/>
            <strong>Sana:</strong> ${escapeHtml(attempt.date || "")}
          </div>
        </div>
      `;
    }

    function renderStartView() {
      app.innerHTML = `
        <div class="badge">TARIX SEMINARI • 15 SAVOL • 30 SONIYA</div>
        <h1>Yangi O‘zbekistonda amalga oshirilayotgan islohotlar</h1>
        <p class="desc">Dars materiallari asosida tuzilgan tezkor test. Har bir savolga javob berish uchun aniq vaqt ajratilgan.</p>
        <div class="rules">
          <div>📌 <strong>Faqat 1 marta qatnashish:</strong> Test boshlangach yoki yakunlangach qayta urinish bloklanadi.</div>
          <div>⏱ <strong>30 soniya taymer:</strong> Vaqt tugasa, savol avtomatik keyingi savolga o‘tadi.</div>
          <div>🎯 <strong>15 ta savol:</strong> Har bir to‘g‘ri javob uchun +1 ball beriladi.</div>
        </div>
        <div class="input-group">
          <label for="studentName">Ism-familiyangizni kiriting</label>
          <input id="studentName" type="text" placeholder="Masalan: Mahamatjonov Masrurbek" required />
        </div>
        <button class="btn" id="startBtn">Testni boshlash</button>
      `;

      document.getElementById("startBtn").addEventListener("click", () => {
        const val = document.getElementById("studentName").value.trim();
        if (!val) {
          alert("Iltimos, avval ism-familiyangizni kiriting!");
          return;
        }
        studentName = val;
        currentIdx = 0;
        score = 0;
        renderQuestion();
      });
    }

    function renderQuestion() {
      clearInterval(timerInterval);
      lockedOption = false;
      timeLeft = QUESTION_TIME;

      const item = QUESTIONS[currentIdx];
      app.innerHTML = `
        <div class="topbar">
          <div class="q-counter">Savol ${currentIdx + 1} / ${QUESTIONS.length}</div>
          <div class="timer-box" id="timerBox">⏱ <span id="timerVal">${timeLeft}</span> s</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar" style="width: 100%;"></div>
        </div>
        <div class="question-text">${escapeHtml(item.q)}</div>
        <div class="options" id="optionsBox">
          ${item.options.map((opt, i) => `
            <button class="option-btn" data-index="${i}">
              <strong>${String.fromCharCode(65 + i)}.</strong> ${escapeHtml(opt)}
            </button>
          `).join("")}
        </div>
        <div class="status-note" id="statusNote">Javobni tanlang — vaqt ketmoqda...</div>
      `;

      const optionButtons = document.querySelectorAll(".option-btn");
      optionButtons.forEach((btn) => {
        btn.addEventListener("click", () => handleSelect(Number(btn.dataset.index)));
      });

      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById("timerVal");
        const timerBox = document.getElementById("timerBox");
        const barEl = document.getElementById("progressBar");

        if (timerEl) timerEl.textContent = Math.max(timeLeft, 0);
        if (barEl) barEl.style.width = `${Math.max((timeLeft / QUESTION_TIME) * 100, 0)}%`;
        if (timerBox && timeLeft <= 10) timerBox.classList.add("danger");

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function handleSelect(selectedIdx) {
      if (lockedOption) return;
      lockedOption = true;
      clearInterval(timerInterval);

      const item = QUESTIONS[currentIdx];
      const buttons = document.querySelectorAll(".option-btn");
      const statusNote = document.getElementById("statusNote");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add("correct");
        if (idx === selectedIdx && selectedIdx !== item.answer) btn.classList.add("wrong");
      });

      if (selectedIdx === item.answer) {
        score++;
        statusNote.textContent = "✅ To‘g‘ri javob! Keyingi savolga o‘tilmoqda...";
      } else {
        statusNote.textContent = "❌ Noto‘g‘ri javob. To‘g‘ri variant yashil rangda ko‘rsatildi.";
      }

      setTimeout(nextStep, 1300);
    }

    function handleTimeout() {
      if (lockedOption) return;
      lockedOption = true;

      const item = QUESTIONS[currentIdx];
      const buttons = document.querySelectorAll(".option-btn");
      const statusNote = document.getElementById("statusNote");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add("correct");
      });

      statusNote.textContent = "⌛ 30 soniya vaqt tugadi! Keyingi savolga o‘tilmoqda...";
      setTimeout(nextStep, 1300);
    }

    function nextStep() {
      currentIdx++;
      if (currentIdx < QUESTIONS.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const percent = Math.round((score / QUESTIONS.length) * 100);
      const attemptData = {
        name: studentName,
        score: score,
        total: QUESTIONS.length,
        percent: percent,
        date: new Date().toLocaleString("uz-UZ")
      };
      saveAttempt(attemptData);

      let comment = "Yaxshi harakat! Mavzuni yana bir bor ko‘rib chiqing.";
      if (percent >= 85) comment = "A’lo natija! Seminarga juda yaxshi tayyorlangansiz.";
      else if (percent >= 60) comment = "Yaxshi natija! Asosiy sanalar va moddalarni o‘zlashtiribsiz.";

      app.innerHTML = `
        <div class="score-card">
          <div class="badge">YAKUNIY NATIJA</div>
          <h1>${escapeHtml(studentName)}</h1>
          <div class="score-big">${score} / ${QUESTIONS.length}</div>
          <p class="desc">${percent}% aniqlik — ${comment}</p>
          <div class="meta-info">
            Ushbu urinish qayd etildi. Qayta qatnashish imkoniyati yopildi.
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const existingAttempt = getAttempt();
    if (existingAttempt) {
      renderLockedView(existingAttempt);
    } else {
      renderStartView();
    }
  </script>
</body>
</html>
